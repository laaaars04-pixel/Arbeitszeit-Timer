<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbeitszeit Timer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel für JSX im Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .input {
      width: 100%;
      border: 1px solid #e5e5e5;
      background: #f5f5f5;
      border-radius: 0.5rem;
      padding: 0.7rem 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      color: #0a0a0a;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .input:focus {
      border-color: #D5001C;
      background: #fff;
    }
    .input-sm {
      width: 100%;
      border: 1px solid #e5e5e5;
      background: #f5f5f5;
      border-radius: 0.5rem;
      padding: 0.4rem 0.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      color: #0a0a0a;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .input-sm:focus {
      border-color: #D5001C;
      background: #fff;
    }
  </style>
</head>
<body class="bg-neutral-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function ChevronLeft({ size = 20, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="m15 18-6-6 6-6"/>
        </svg>
      );
    }

    function ChevronRight({ size = 20, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="m9 18 6-6-6-6"/>
        </svg>
      );
    }

    function Clock3({ size = 20, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 16.5 12"/>
        </svg>
      );
    }

    function CalendarDays({ size = 20, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
          <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>
          <path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
        </svg>
      );
    }

    function AlertTriangle({ size = 20, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      );
    }

    const STORAGE_KEY = "arbeitszeit-timer-v5";
    const WEEKDAYS = ["MO", "DI", "MI", "DO", "FR", "SA", "SO"];
    const MONTHS = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function dateKey(year, month, day) {
      return `${year}-${pad(month + 1)}-${pad(day)}`;
    }

    function todayKey() {
      const now = new Date();
      return dateKey(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatHours(hours) {
      const sign = hours < 0 ? "-" : "";
      const absolute = Math.abs(hours);
      let h = Math.floor(absolute);
      let m = Math.round((absolute - h) * 60);
      if (m === 60) {
        h += 1;
        m = 0;
      }
      return `${sign}${h}h ${pad(m)}min`;
    }

    function formatClock(minutesFromMidnight) {
      let total = Math.round(minutesFromMidnight);
      total = ((total % 1440) + 1440) % 1440;
      return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
    }

    function getCalendarCells(year, month) {
      const first = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0).getDate();
      const mondayBasedOffset = (first.getDay() + 6) % 7;
      const cells = Array.from({ length: mondayBasedOffset }, () => null);
      for (let day = 1; day <= lastDay; day += 1) cells.push(day);
      while (cells.length % 7 !== 0) cells.push(null);
      return cells;
    }

    // Feiertagsberechnung für Baden-Württemberg (inkl. Gaußscher Osterformel)
    function getHolidaysBW(year) {
      const holidays = {};

      const addHoliday = (d, name) => {
        const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        holidays[key] = name;
      };

      // Feste Feiertage BW
      addHoliday(new Date(year, 0, 1), "Neujahr");
      addHoliday(new Date(year, 0, 6), "Heilige Drei Könige");
      addHoliday(new Date(year, 4, 1), "Tag der Arbeit");
      addHoliday(new Date(year, 9, 3), "Tag der Deutschen Einheit");
      addHoliday(new Date(year, 10, 1), "Allerheiligen");
      addHoliday(new Date(year, 11, 25), "1. Weihnachtstag");
      addHoliday(new Date(year, 11, 26), "2. Weihnachtstag");

      // Ostersonntag berechnen (Meeus/Jones/Butcher Algorithmus)
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      const easterSunday = new Date(year, month, day);

      const addRelativeEaster = (offsetDays, name) => {
        const d = new Date(easterSunday);
        d.setDate(d.getDate() + offsetDays);
        addHoliday(d, name);
      };

      // Bewegliche Feiertage BW
      addRelativeEaster(-2, "Karfreitag");
      addRelativeEaster(1, "Ostermontag");
      addRelativeEaster(39, "Christi Himmelfahrt");
      addRelativeEaster(50, "Pfingstmontag");
      addRelativeEaster(60, "Fronleichnam");

      return holidays;
    }

    function ArbeitszeitTimer() {
      const now = new Date();
      const [weeklyHours, setWeeklyHours] = useState(35);
      const [pauseMin, setPauseMin] = useState(45);
      const [workDays, setWorkDays] = useState([0, 1, 2, 3, 4]);
      
      const [customHoursOn, setCustomHoursOn] = useState(false);
      const [dayHours, setDayHours] = useState({
        0: 7, 1: 7, 2: 7, 3: 7, 4: 7, 5: 0, 6: 0
      });

      const [overtimeOn, setOvertimeOn] = useState(false);
      const [overtimeMode, setOvertimeMode] = useState("reduce");
      const [overtimeHours, setOvertimeHours] = useState(4);
      const [selectedDates, setSelectedDates] = useState([]);
      const [startTime, setStartTime] = useState("");
      const [viewYear, setViewYear] = useState(now.getFullYear());
      const [viewMonth, setViewMonth] = useState(now.getMonth());
      const [clockTick, setClockTick] = useState(Date.now());
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            if (saved.weeklyHours !== undefined) setWeeklyHours(saved.weeklyHours);
            if (saved.pauseMin !== undefined) setPauseMin(saved.pauseMin);
            if (Array.isArray(saved.workDays)) setWorkDays(saved.workDays);
            if (saved.customHoursOn !== undefined) setCustomHoursOn(Boolean(saved.customHoursOn));
            if (saved.dayHours) setDayHours(saved.dayHours);
            if (saved.overtimeOn !== undefined) setOvertimeOn(Boolean(saved.overtimeOn));
            if (saved.overtimeMode !== undefined) setOvertimeMode(saved.overtimeMode);
            if (saved.overtimeHours !== undefined) setOvertimeHours(saved.overtimeHours);
            if (Array.isArray(saved.selectedDates)) setSelectedDates(saved.selectedDates);
            if (saved.startTime !== undefined) setStartTime(saved.startTime);
          }
        } catch (error) {
          console.warn("Einstellungen konnten nicht geladen werden.", error);
        }
        setLoaded(true);
      }, []);

      useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            weeklyHours, pauseMin, workDays, customHoursOn, dayHours, overtimeOn, overtimeMode, overtimeHours, selectedDates, startTime
          }));
        } catch (error) {
          console.warn("Einstellungen konnten nicht gespeichert werden.", error);
        }
      }, [loaded, weeklyHours, pauseMin, workDays, customHoursOn, dayHours, overtimeOn, overtimeMode, overtimeHours, selectedDates, startTime]);

      useEffect(() => {
        const interval = setInterval(() => setClockTick(Date.now()), 30000);
        return () => clearInterval(interval);
      }, []);

      const cells = useMemo(() => getCalendarCells(viewYear, viewMonth), [viewYear, viewMonth]);
      const currentDayIndex = (new Date(clockTick).getDay() + 6) % 7;
      const dayCount = workDays.length;

      // Feiertage für das im Kalender angezeigte Jahr
      const holidays = useMemo(() => getHolidaysBW(viewYear), [viewYear]);

      const targetToday = useMemo(() => {
        if (!workDays.includes(currentDayIndex)) return 0;
        if (customHoursOn) {
          return Number(dayHours[currentDayIndex] || 0);
        }
        return dayCount ? Number(weeklyHours || 0) / dayCount : 0;
      }, [customHoursOn, dayHours, currentDayIndex, workDays, weeklyHours, dayCount]);

      const displayWeeklyHours = useMemo(() => {
        if (!customHoursOn) return Number(weeklyHours || 0);
        return workDays.reduce((sum, d) => sum + Number(dayHours[d] || 0), 0);
      }, [customHoursOn, weeklyHours, workDays, dayHours]);

      const overtimePerSelectedDay = selectedDates.length
        ? Number(overtimeHours || 0) / selectedDates.length
        : 0;
      const selectedToday = overtimeOn && selectedDates.includes(todayKey());
      
      const todayAdjustment = selectedToday ? overtimePerSelectedDay : 0;
      const netWork = useMemo(() => {
        if (!selectedToday) return targetToday;
        if (overtimeMode === "reduce") {
          return Math.max(0, targetToday - todayAdjustment);
        } else {
          return targetToday + todayAdjustment;
        }
      }, [targetToday, selectedToday, overtimeMode, todayAdjustment]);

      const totalDuration = netWork + Number(pauseMin || 0) / 60;
      const exceedsMaxHours = netWork > 10;

      const result = useMemo(() => {
        if (!workDays.includes(currentDayIndex)) {
          return { end: "--:--", message: "Heute ist laut Einstellung kein Arbeitstag.", progress: 0 };
        }
        if (!startTime) {
          return { end: "--:--", message: "Bitte Arbeitsbeginn eingeben.", progress: 0 };
        }
        const [hours, minutes] = startTime.split(":").map(Number);
        const startMinutes = hours * 60 + minutes;
        const endMinutes = startMinutes + totalDuration * 60;
        const current = new Date(clockTick);
        const currentMinutes = current.getHours() * 60 + current.getMinutes();
        const elapsed = currentMinutes - startMinutes;
        const totalMinutes = totalDuration * 60;
        const progress = Math.max(0, Math.min(100, totalMinutes > 0 ? (elapsed / totalMinutes) * 100 : 0));
        const remaining = endMinutes - currentMinutes;
        let message = "Arbeitsbeginn liegt in der Zukunft.";
        if (remaining <= 0 && elapsed >= 0) message = "Feierabend erreicht. Guten Abend!";
        else if (elapsed >= 0) message = `Noch ${formatHours(remaining / 60)} bis Feierabend.`;
        return { end: formatClock(endMinutes), message, progress };
      }, [startTime, currentDayIndex, workDays, totalDuration, clockTick]);

      function toggleWorkDay(day) {
        setWorkDays(current => current.includes(day) ? current.filter(value => value !== day) : [...current, day].sort());
      }

      function updateDayHours(day, value) {
        setDayHours(prev => ({
          ...prev,
          [day]: value === "" ? "" : Number(value)
        }));
      }

      function toggleDate(day) {
        if (!day) return;
        const key = dateKey(viewYear, viewMonth, day);
        if (holidays[key]) return; // Gesetzliche Feiertage überspringen
        setSelectedDates(current => current.includes(key) ? current.filter(value => value !== key) : [...current, key].sort());
      }

      function changeMonth(delta) {
        const next = new Date(viewYear, viewMonth + delta, 1);
        setViewYear(next.getFullYear());
        setViewMonth(next.getMonth());
      }

      function setNow() {
        const time = new Date();
        setStartTime(`${pad(time.getHours())}:${pad(time.getMinutes())}`);
      }

      const reductionExceedsWarning = overtimeOn && overtimeMode === "reduce" && selectedDates.length > 0 && overtimePerSelectedDay > targetToday;

      return (
        <main className="min-h-screen bg-neutral-100 px-4 py-8 text-neutral-950 font-sans">
          <div className="mx-auto max-w-lg">
            <header className="mb-7">
              <div className="mb-7 flex items-center gap-2.5">
                <span className="h-3.5 w-3.5 rounded-full bg-[#D5001C]" />
                <span className="text-xs font-extrabold uppercase tracking-[0.22em]">Timer</span>
              </div>
              <h1 className="text-3xl font-black uppercase tracking-tight">Arbeitszeit</h1>
              <p className="mt-1 text-sm font-medium text-neutral-500">Feierabend berechnen. Überstundenabbau oder -aufbau tagegenau im Kalender planen.</p>
            </header>

            <section className="mb-4 rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <SectionTitle>Grundlagen</SectionTitle>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Wochenstunden" hint={customHoursOn ? "Berechnet aus Wochentagen" : undefined}>
                  <input 
                    className={`input ${customHoursOn ? "opacity-60 bg-neutral-100 cursor-not-allowed" : ""}`} 
                    type="number" 
                    min="0" 
                    step="0.5" 
                    disabled={customHoursOn}
                    value={customHoursOn ? displayWeeklyHours : weeklyHours} 
                    onChange={e => setWeeklyHours(e.target.value)} 
                  />
                </Field>
                <Field label="Pause (Min.)" hint="Zählt nicht als Arbeitszeit">
                  <input className="input" type="number" min="0" step="5" value={pauseMin} onChange={e => setPauseMin(e.target.value)} />
                </Field>
              </div>
            </section>

            <section className="mb-4 rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <SectionTitle>Arbeitstage</SectionTitle>
              <div className="flex gap-1.5 mb-4">
                {WEEKDAYS.map((name, index) => (
                  <button 
                    key={name} 
                    type="button" 
                    onClick={() => toggleWorkDay(index)} 
                    className={`min-w-0 flex-1 rounded-lg border py-2.5 text-xs font-extrabold transition ${workDays.includes(index) ? "border-neutral-950 bg-neutral-950 text-white" : "border-neutral-200 bg-neutral-100 text-neutral-500 hover:border-neutral-400"}`}
                  >
                    {name}
                  </button>
                ))}
              </div>

              <div className="pt-3 border-t border-neutral-100">
                <button 
                  type="button" 
                  onClick={() => setCustomHoursOn(v => !v)} 
                  className="flex w-full items-center justify-between text-left py-1 text-xs font-bold text-neutral-700 hover:text-neutral-950"
                >
                  <span>Individuelle Stunden je Tag anpassen</span>
                  <span className={`relative h-5 w-9 rounded-full transition ${customHoursOn ? "bg-[#D5001C]" : "bg-neutral-200"}`}>
                    <span className={`absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition ${customHoursOn ? "translate-x-4" : "translate-x-0.5"}`} />
                  </span>
                </button>

                {customHoursOn && (
                  <div className="mt-4 grid grid-cols-5 gap-2 bg-neutral-50 p-3 rounded-xl border border-neutral-200">
                    {workDays.length === 0 ? (
                      <span className="col-span-5 text-xs text-neutral-400">Keine Tage ausgewählt.</span>
                    ) : (
                      workDays.map(dayIdx => (
                        <div key={dayIdx} className="flex flex-col items-center">
                          <span className="text-[11px] font-bold text-neutral-500 mb-1">{WEEKDAYS[dayIdx]}</span>
                          <input 
                            type="number" 
                            min="0" 
                            max="24" 
                            step="0.25"
                            className="input-sm" 
                            value={dayHours[dayIdx] ?? ""} 
                            onChange={e => updateDayHours(dayIdx, e.target.value)}
                          />
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </section>

            <section className="mb-4 rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <button type="button" onClick={() => setOvertimeOn(value => !value)} className="flex w-full items-center justify-between gap-4 text-left">
                <span className="font-bold">Überstunden verwalten</span>
                <span className={`relative h-6 w-11 rounded-full transition ${overtimeOn ? "bg-[#D5001C]" : "bg-neutral-200"}`}>
                  <span className={`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition ${overtimeOn ? "translate-x-5" : "translate-x-0.5"}`} />
                </span>
              </button>

              {overtimeOn && (
                <div className="mt-5 border-t border-neutral-200 pt-5">
                  <div className="mb-4 flex rounded-lg bg-neutral-100 p-1 border border-neutral-200">
                    <button
                      type="button"
                      onClick={() => setOvertimeMode("reduce")}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${overtimeMode === "reduce" ? "bg-white text-neutral-950 shadow-sm" : "text-neutral-500 hover:text-neutral-950"}`}
                    >
                      Überstunden abbauen (-)
                    </button>
                    <button
                      type="button"
                      onClick={() => setOvertimeMode("build")}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-md transition ${overtimeMode === "build" ? "bg-white text-neutral-950 shadow-sm" : "text-neutral-500 hover:text-neutral-950"}`}
                    >
                      Überstunden aufbauen (+)
                    </button>
                  </div>

                  <Field 
                    label={overtimeMode === "reduce" ? "Stunden abbauen (gesamt)" : "Stunden aufbauen (gesamt)"} 
                    hint={selectedDates.length ? `Verteilung auf ${selectedDates.length} ausgewählte${selectedDates.length === 1 ? "n Tag" : " Tage"}: ${formatHours(overtimePerSelectedDay)} je Tag` : "Bitte unten mindestens einen Kalendertag auswählen"}
                  >
                    <input className="input" type="number" min="0" step="0.25" value={overtimeHours} onChange={e => setOvertimeHours(e.target.value)} />
                  </Field>

                  <div className="mt-5 rounded-xl border border-neutral-200 p-3">
                    <div className="mb-4 flex items-center justify-between">
                      <button type="button" aria-label="Vorheriger Monat" onClick={() => changeMonth(-1)} className="rounded-lg p-2 hover:bg-neutral-100 text-neutral-700">
                        <ChevronLeft size={18} />
                      </button>
                      <div className="flex items-center gap-2 font-extrabold">
                        <CalendarDays size={17} className="text-[#D5001C]" />
                        {MONTHS[viewMonth]} {viewYear}
                      </div>
                      <button type="button" aria-label="Nächster Monat" onClick={() => changeMonth(1)} className="rounded-lg p-2 hover:bg-neutral-100 text-neutral-700">
                        <ChevronRight size={18} />
                      </button>
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                      {WEEKDAYS.map(day => (
                        <div key={day} className="py-1 text-center text-[10px] font-extrabold text-neutral-400">
                          {day}
                        </div>
                      ))}
                      {cells.map((day, index) => {
                        if (!day) return <div key={`blank-${index}`} />;
                        const key = dateKey(viewYear, viewMonth, day);
                        const selected = selectedDates.includes(key);
                        const isToday = key === todayKey();
                        const holidayName = holidays[key];

                        return (
                          <button 
                            key={key} 
                            type="button" 
                            disabled={Boolean(holidayName)}
                            onClick={() => toggleDate(day)} 
                            title={holidayName ? `Feiertag (BW): ${holidayName}` : (selected ? "Markierung entfernen" : "Tag markieren")}
                            className={`aspect-square rounded-lg text-sm font-bold transition flex flex-col items-center justify-center relative
                              ${holidayName 
                                ? "bg-purple-100/70 text-purple-900 border border-purple-200 cursor-not-allowed opacity-85" 
                                : selected 
                                  ? "bg-[#D5001C] text-white shadow-sm" 
                                  : "bg-neutral-100 text-neutral-700 hover:bg-neutral-200"} 
                              ${isToday && !selected ? "ring-2 ring-[#D5001C] ring-inset" : ""}`} 
                          >
                            <span>{day}</span>
                            {holidayName && (
                              <span className="h-1 w-1 rounded-full bg-purple-600 mt-0.5" />
                            )}
                          </button>
                        );
                      })}
                    </div>

                    {/* Legende */}
                    <div className="mt-3 flex flex-wrap items-center justify-between gap-2 text-[11px] text-neutral-500 border-t border-neutral-100 pt-2">
                      <div className="flex items-center gap-3">
                        <span className="flex items-center gap-1.5">
                          <span className="h-2 w-2 rounded-full bg-[#D5001C]" />
                          <span>{overtimeMode === "reduce" ? "Abbau" : "Aufbau"}</span>
                        </span>
                        <span className="flex items-center gap-1.5">
                          <span className="h-2 w-2 rounded-full bg-purple-600" />
                          <span>Feiertag (BW)</span>
                        </span>
                      </div>
                      {selectedDates.length > 0 && (
                        <button type="button" onClick={() => setSelectedDates([])} className="font-bold text-[#D5001C] hover:underline">
                          Auswahl löschen
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </section>

            <section className="mb-4 rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
              <SectionTitle>Heute ({WEEKDAYS[currentDayIndex]})</SectionTitle>
              <Field label="Arbeitsbeginn">
                <input className="input" type="time" value={startTime} onChange={e => setStartTime(e.target.value)} />
              </Field>
              <button type="button" onClick={setNow} className="mt-2 w-full rounded-lg border border-neutral-950 px-3 py-2.5 text-xs font-extrabold uppercase tracking-widest transition hover:bg-neutral-950 hover:text-white">
                Jetzt übernehmen
              </button>
            </section>

            {exceedsMaxHours && (
              <div className="mb-4 flex items-start gap-3 rounded-2xl border-2 border-[#D5001C] bg-red-50 p-4 text-red-950 shadow-sm animate-pulse">
                <div className="shrink-0 text-[#D5001C] mt-0.5">
                  <AlertTriangle size={22} />
                </div>
                <div className="text-xs leading-relaxed">
                  <span className="block font-black uppercase tracking-wide text-sm text-[#D5001C]">Achtung: Über 10 Stunden Arbeitszeit!</span>
                  Deine geplante effektive Arbeitszeit für heute beträgt <strong className="font-extrabold underline">{formatHours(netWork)}</strong> (ohne Pause). Nach dem Arbeitszeitgesetz (§ 3 ArbZG) darf die werktägliche Arbeitszeit von 10 Stunden grundsätzlich nicht überschritten werden.
                </div>
              </div>
            )}

            {reductionExceedsWarning && (
              <div className="mb-4 rounded-xl border border-amber-300 bg-amber-50 p-3 text-sm font-semibold text-amber-800">
                Der Abbau je ausgewähltem Tag übersteigt die heutige Soll-Arbeitszeit. Bitte Werte prüfen.
              </div>
            )}

            <section className="relative overflow-hidden rounded-2xl bg-neutral-950 p-6 text-white shadow-lg">
              <div className="absolute inset-x-0 top-0 h-1 bg-[#D5001C]" />
              <div className="text-[11px] font-extrabold uppercase tracking-[0.18em] text-neutral-400">Feierabend</div>
              <div className="mt-1 text-6xl font-black tabular-nums tracking-tight">{result.end}</div>
              <div className="mt-2 text-sm font-medium text-neutral-400">{result.message}</div>
              {overtimeOn && (
                <div className={`mt-3 inline-flex rounded-full px-3 py-1 text-xs font-bold ${selectedToday ? "bg-[#D5001C] text-white" : "bg-neutral-800 text-neutral-300"}`}>
                  {selectedToday ? (
                    overtimeMode === "reduce" 
                      ? `Heute ${formatHours(todayAdjustment)} Überstundenabbau` 
                      : `Heute +${formatHours(todayAdjustment)} Überstundenaufbau`
                  ) : "Heute keine Überstunden geplant"}
                </div>
              )}
              <div className="mt-5 h-1.5 overflow-hidden rounded-full bg-neutral-800">
                <div className="h-full rounded-full bg-[#D5001C] transition-all duration-300" style={{ width: `${result.progress}%` }} />
              </div>
              <div className="mt-5 grid grid-cols-2 gap-4 border-t border-neutral-800 pt-4">
                <Metric label={`Soll heute (${WEEKDAYS[currentDayIndex]})`} value={workDays.includes(currentDayIndex) ? formatHours(targetToday) : "Frei"} />
                <Metric 
                  label={overtimeMode === "reduce" ? "Abbau heute" : "Aufbau heute"} 
                  value={selectedToday ? `${overtimeMode === "reduce" ? "-" : "+"}${formatHours(todayAdjustment)}` : "–"} 
                />
                <Metric label="Effektive Arbeit" value={workDays.includes(currentDayIndex) ? formatHours(netWork) : "–"} />
                <Metric label="Pause" value={`+${formatHours(Number(pauseMin || 0) / 60)}`} />
              </div>
            </section>

            <footer className="mt-6 flex items-center justify-center gap-2 text-xs font-semibold text-neutral-400">
              <Clock3 size={14} />
              <span>Einstellungen und Kalendertage werden lokal gespeichert</span>
            </footer>
          </div>
        </main>
      );
    }

    function SectionTitle({ children }) {
      return (
        <div className="mb-4 flex items-center gap-2 text-[11px] font-extrabold uppercase tracking-[0.14em] text-neutral-500">
          <span>{children}</span>
          <span className="h-px flex-1 bg-neutral-200" />
        </div>
      );
    }

    function Field({ label, hint, children }) {
      return (
        <label className="block">
          <span className="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-neutral-500">{label}</span>
          {children}
          {hint && <span className="mt-1.5 block text-[11px] font-medium text-neutral-500">{hint}</span>}
        </label>
      );
    }

    function Metric({ label, value }) {
      return (
        <div>
          <div className="text-[10px] font-bold uppercase tracking-wider text-neutral-400">{label}</div>
          <div className="mt-1 text-base font-extrabold tabular-nums">{value}</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ArbeitszeitTimer />);
  </script>
</body>
</html>
